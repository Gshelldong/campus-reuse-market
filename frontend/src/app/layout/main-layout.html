<nz-header class="glass sticky top-0 z-50 border-b" style="border-bottom-color: rgba(0, 0, 0, 0.06); height: 64px; line-height: 64px; padding: 0;">
  <div class="container-apple flex items-center justify-between" style="height: 64px;">
    <!-- 左侧：平台名称 + 首页 / 逛市场 -->
    <div class="flex items-center gap-10">
      <a routerLink="/home" class="flex items-center gap-2 text-[19px] font-semibold tracking-tight" style="color: var(--color-text);">
        <span nz-icon nzType="shop" nzTheme="filled" class="text-[22px]" style="color: var(--color-primary);"></span>
        <span>校园二手交易平台</span>
      </a>
      <nav class="hidden md:flex items-center gap-7">
        <a
          routerLink="/home"
          routerLinkActive="nav-link-active"
          class="text-[15px] transition-colors duration-200 hover:text-[#0071e3]"
          style="color: var(--color-text-secondary);"
        >首页</a>
        <a
          routerLink="/home"
          (click)="scrollToMarket()"
          class="text-[15px] transition-colors duration-200 hover:text-[#0071e3]"
          style="color: var(--color-text-secondary);"
        >逛市场</a>
      </nav>
    </div>

    <!-- 右侧：消息、联系我们、发布、头像 -->
    <div class="flex items-center gap-5">
      @if (currentUser(); as user) {
        <a routerLink="/chat" class="relative flex items-center justify-center w-9 h-9 rounded-full transition-colors duration-200 hover:bg-black/5" title="我的消息">
          <span nz-icon nzType="bell" nzTheme="outline" class="text-[18px]" style="color: var(--color-text-secondary);"></span>
          @if (unread() > 0) {
            <span class="absolute -top-0.5 -right-0.5 min-w-[17px] h-[17px] px-1 rounded-full text-[11px] leading-[17px] text-center text-white" style="background: var(--color-danger);">
              {{ unread() > 99 ? '99+' : unread() }}
            </span>
          }
        </a>
        <a href="#contact" class="hidden sm:flex items-center text-[15px] transition-colors duration-200 hover:text-[#0071e3]" style="color: var(--color-text-secondary);">
          联系我们
        </a>
        <button class="btn-primary !py-2 !px-5 !text-[14px]" routerLink="/publish">
          <span nz-icon nzType="plus" class="mr-1 text-[13px]"></span>发布
        </button>
        <a
          class="flex items-center gap-1.5 cursor-pointer"
          nz-dropdown
          [nzDropdownMenu]="userMenu"
          nzPlacement="bottomRight"
        >
          <img
            class="w-8 h-8 rounded-full object-cover"
            style="box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);"
            [src]="img(user.avatar) || '/avatar-default.svg'"
            alt=""
          />
          <span nz-icon nzType="down" class="text-[11px]" style="color: var(--color-text-tertiary);"></span>
        </a>
      } @else {
        <a routerLink="/login" class="text-[15px] transition-colors duration-200 hover:text-[#0071e3]" style="color: var(--color-text-secondary);">登录</a>
        <a routerLink="/register" class="btn-primary !py-2 !px-5 !text-[14px]">注册</a>
      }
    </div>
  </div>
</nz-header>

<nz-content style="min-height: calc(100vh - 64px); background: var(--color-bg-secondary);">
  <div class="page-content-host">
    <router-outlet />
  </div>
</nz-content>

<nz-dropdown-menu #userMenu="nzDropdownMenu">
  <ul nz-menu class="!rounded-xl overflow-hidden">
    <li nz-menu-item routerLink="/profile">
      <span nz-icon nzType="user" class="mr-2"></span>
      <span>个人中心</span>
    </li>
    <li nz-menu-item (click)="logout()">
      <span nz-icon nzType="logout" class="mr-2"></span>
      <span>退出登录</span>
    </li>
  </ul>
</nz-dropdown-menu>
