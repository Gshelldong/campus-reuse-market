<a [routerLink]="['/goods', goods().id]" class="card-link">
  <mat-card class="goods-card">
    <div class="cover">
      <img [src]="cover()" [alt]="goods().title" loading="lazy" />
      @if (showStatus() && goods().status !== 1) {
        <span class="status-tag" [attr.data-color]="goodsStatusColor(goods().status)">
          {{ goodsStatusText(goods().status) }}
        </span>
      }
    </div>
    <mat-card-content>
      <p class="title" [title]="goods().title">{{ goods().title }}</p>
      <div class="price-row">
        <span class="price">¥{{ goods().price }}</span>
        @if (goods().original_price) {
          <span class="original-price">¥{{ goods().original_price }}</span>
        }
      </div>
      <div class="meta-row">
        <span class="condition">{{ conditionText(goods().condition) }}</span>
        <span class="seller">
          <img class="seller-avatar" [src]="goods().avatar || '/avatar-default.svg'" alt="" />
          {{ goods().nickname || '同学' }}
        </span>
      </div>
    </mat-card-content>
  </mat-card>
</a>
